<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Grid Gantt Chart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            padding: 20px;
            border: none;
        }
        .gantt-container {
            display: grid;
            grid-template-columns: 150px repeat(13, 1fr); /* 150px for task names, 13 columns for months */
            grid-gap: 8px 0;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        /* Headers */
        .gantt-header {
            font-weight: bold;
            text-align: center;
            padding: 10px 0;
            background: #eaeaea;
            border-bottom: 2px solid #ccc;
        }
        .task-name-header {
            grid-column: 1;
            text-align: left;
            padding-left: 10px;
        }
        /* Rows */
        .task-label {
            grid-column: 1;
            font-size: 0.9em;
            font-weight: regular;
            display: flex;
            align-items: center;
            background: #f9f9f9;
            padding-left: 10px;
            border-right: 1px solid #ddd;
        }
        .button {
            height: 35px;
            border: none;
            display: flex;
            align-items: center;
            padding-left: 10px;
            color: white;
            text-decoration: none;
            font-size: 0.7em;
            font-weight: bold;
            width: 100%;
        }        
        /* Custom tracks & positioning (Start Column / End Column) */
        /* Note: Column 1 is labels. */
        .task-1 { grid-column: 3 / 5; background-color: #46648E; } /* Jul to Aug */
        .task-2 { grid-column: 5 / 6; background-color: #46648E; } /* Aug to Oct */
        .task-3 { grid-column: 5 / 7; background-color: #46648E; } /* Oct to Dec */
        .task-4 { grid-column: 5 / 6; background-color: #F36F31; } /* Sep to Nov */
        .task-5_1 { grid-column: 5 / 7; background-color: #F36F31; } /* Sep to Nov */
        .task-5_2 { grid-column: 12 / 15; background-color: #F36F31; } /* Sep to Nov */
        .task-6 { grid-column: 7 / 12; background-color: #A3AFC1; } /* Nov to Apr */
    </style>
</head>
<body>

    <h2 id="demo"></h2>

    <div class="gantt-container">
        <!-- Timeline Headers -->
        <div class="gantt-header task-name-header">Tasks</div>
        <div class="gantt-header">Jun</div>
        <div class="gantt-header">Jul</div>
        <div class="gantt-header">Aug</div>
        <div class="gantt-header">Sep</div>
        <div class="gantt-header">Oct</div>
        <div class="gantt-header">Nov</div>
        <div class="gantt-header">Dec</div>
        <div class="gantt-header">Jan</div>
        <div class="gantt-header">Feb</div>
        <div class="gantt-header">Mar</div>
        <div class="gantt-header">Apr</div>
        <div class="gantt-header">May</div>
        <div class="gantt-header">Jun</div>


        <!-- Row 1 -->
        <div class="task-label">Segment 1</div>
        <button class="button task-1" type="button" onclick="document.getElementById('demo').innerHTML = `Segment 1 July 2026 - August 2027 <br>
Reconstruction of Port Lansing Rd between Airport Rd and Capital City Blvd.
<br>
Detour: <br>
EB N Grand River Ave to Capital City Blvd
<br>
SB Capital City Blvd to N Grand River Ave`">
7/1 - 8/24</button>

        <!-- Row 2 -->
        <div class="task-label">Segment 2</div>
        <button class="button task-2" type="button" onclick="document.getElementById('demo').innerHTML = `Segment 2 August 2026 - September 2026 <br>
Reconstruction of Port Lansing Rd between Capital City Blvd and west of the eastern UPS driveway.
<br>
Detour: <br>
Traffic to Capital City Blvd, Grand River Ave, and Dewitt Rd. 
<br>
Access to all businesses will be maintained.`">
8/31 - 9/25</button>

        <!-- Row 3 -->
        <div class="task-label">Segment 3</div>
        <button class="button task-3" type="button" onclick="document.getElementById('demo').innerHTML = `Segment 3 August 2026 - November 2026 <br>
Reconstruction of Port Lansing Rd and shoulder construction on Port Lansing Rd between west of the eastern UPS driveway and Dewitt Rd.
<br>
Detour: <br>
Traffic to Capital City Blvd, Grand River Ave, and Dewitt Rd. 
<br>
Access to all businesses will be maintained.`">
8/31 - 11/14</button>

        <!-- Row 4 -->
        <div class="task-label">Segment 4</div>
        <button class="button task-4" type="button" onclick="document.getElementById('demo').innerHTML = `Segment 4 August 2026 - September 2026 <br>
Reconstruction of Capital City Blvd between Port Lansing Rd and Commerce Rd and reconstruction of crossovers between Port Lansing Rd and Commerce Rd.
<br>
Detour: <br>
Maintain one lane of traffic in each direction on the east side of Capital City Blvd.

All business access will be maintained.`">
8/24 - 9/23</button>
        
        <!-- Row 5 -->
        <div class="task-label">Segment 5</div>
        <button class="button task-5_1" type="button" onclick="document.getElementById('demo').innerHTML = `Segment 5 September 2026 - June 2027 <br>
Reconstruction of Capital City Blvd south of Port Lansing Rd.
<br>
Detour: <br>
Information coming soon.`">
9/11/26 - 6/23/27</button>
        <button class="button task-5_2" type="button" onclick="document.getElementById('demo').innerHTML = `Segment 5 September 2026 - June 2027 <br>
Reconstruction of Capital City Blvd south of Port Lansing Rd.
<br>
Detour: <br>
Information coming soon.`">
9/11/26 - 6/23/27</button>
        
        <!-- Row 6 -->
        <div class="task-label">Winter Shutdown</div>
        <button class="button task-6" type="button" onclick="document.getElementById('demo').innerHTML = `Winter Shutdown November 2026 - April 2027`">
11/14 - 4/15</button>
    </div>

</body>
</html>
